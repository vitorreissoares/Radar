# Monta o programa Radar para Windows, Mac e Linux.
#
# - A cada envio para a branch main, os instaladores são montados e publicados na
#   página "Releases", na versão indicada em desktop/package.json ("version").
#   Para lançar uma versão nova, basta mudar esse número (ex.: 1.0.0 -> 1.1.0).
#   Enviar de novo com o mesmo número atualiza os arquivos dessa versão.
# - Também dá para rodar à mão (aba Actions > Programa de computador > Run workflow).
#
# Cada instalador leva o R e os pacotes dentro: quem instala não precisa de mais nada.

name: Programa de computador

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Um envio novo cancela a montagem anterior que ainda estiver rodando
concurrency:
  group: programa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  construir:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
            micromamba: win-64
            plataforma: win-64
            builder: --win --x64
            recursos: dist/win-unpacked/resources
            arquivos: desktop/dist/*.exe
          - nome: Mac (chip Apple)
            os: macos-14
            micromamba: osx-arm64
            plataforma: osx-arm64
            builder: --mac --arm64
            recursos: dist/mac-arm64/Radar.app/Contents/Resources
            arquivos: desktop/dist/*.dmg
          - nome: Mac (Intel)
            os: macos-14
            micromamba: osx-arm64
            plataforma: osx-64
            builder: --mac --x64
            recursos: dist/mac/Radar.app/Contents/Resources
            arquivos: desktop/dist/*.dmg
          - nome: Linux
            os: ubuntu-22.04
            micromamba: linux-64
            plataforma: linux-64
            builder: --linux --x64
            recursos: dist/linux-unpacked/resources
            arquivos: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Instalar o micromamba
        run: |
          mkdir -p "$RUNNER_TEMP/mm"
          cd "$RUNNER_TEMP/mm"
          # caminhos relativos: o tar do Windows confunde "D:" com um servidor remoto
          bash "$GITHUB_WORKSPACE/desktop/build/rodar.sh" "Baixar o micromamba" \
            curl -fsSL "https://micro.mamba.pm/api/micromamba/${{ matrix.micromamba }}/latest" -o mm.tar.bz2
          bash "$GITHUB_WORKSPACE/desktop/build/rodar.sh" "Extrair o micromamba" tar -xjf mm.tar.bz2
          if [ -f Library/bin/micromamba.exe ]; then
            echo "MM=$RUNNER_TEMP/mm/Library/bin/micromamba.exe" >> "$GITHUB_ENV"
          else
            echo "MM=$RUNNER_TEMP/mm/bin/micromamba" >> "$GITHUB_ENV"
          fi

      - name: Montar o R com os pacotes do projeto
        run: |
          # O pacote av não existe para Mac com chip Apple: lá o áudio sai pelo ffmpeg
          PACOTES="$(cat desktop/build/pacotes_r.txt) ffmpeg"
          if [ "${{ matrix.plataforma }}" != "osx-arm64" ]; then PACOTES="$PACOTES r-av"; fi
          bash desktop/build/rodar.sh "Montar o R" \
            "$MM" create -y -r "$RUNNER_TEMP/mamba" -p desktop/r-env --platform ${{ matrix.plataforma }} \
            -c conda-forge --override-channels $PACOTES
          bash desktop/build/rodar.sh "Enxugar o R" bash desktop/build/enxugar_r.sh desktop/r-env

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Montar o instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bash build/rodar.sh "npm install" npm install --no-audit --no-fund
          bash build/rodar.sh "Montar o instalador" npx electron-builder ${{ matrix.builder }} --publish never

      - name: Testar o programa montado
        # O Mac Intel é montado num Mac com chip Apple: o teste depende do Rosetta
        continue-on-error: ${{ matrix.plataforma == 'osx-64' }}
        run: bash desktop/build/rodar.sh "Testar o programa" bash desktop/build/testar_pacote.sh "desktop/${{ matrix.recursos }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Radar ${{ matrix.nome }}
          path: ${{ matrix.arquivos }}
          if-no-files-found: error

  publicar:
    name: Publicar a versão
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ler o número da versão
        id: versao
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: Radar ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: instaladores/*
          body: |
            ## Baixe o instalador do seu computador

            | Sistema | Arquivo |
            |---|---|
            | **Windows** | `Radar-…-win-x64.exe` |
            | **Mac com chip Apple** (M1, M2, M3…) | `Radar-…-mac-arm64.dmg` |
            | **Mac com Intel** | `Radar-…-mac-x64.dmg` |
            | **Linux** | `.AppImage` (qualquer distribuição) ou `.deb` (Ubuntu, Debian) |

            Na primeira vez, cada pessoa informa a **própria chave do OpenRouter** no programa.
            Veja o passo a passo de instalação no README do repositório.
